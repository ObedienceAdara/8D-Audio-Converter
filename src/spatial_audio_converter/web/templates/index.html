<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spatial Audio Converter</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="shell">
    <header>
      <p class="eyebrow">SPATIAL AUDIO ENGINE</p>
      <h1>8D / Spatial Audio Converter</h1>
      <p>Upload an audio file, configure the spatial pipeline, and download the processed result.</p>
    </header>

    <section class="card">
      <form id="convert-form">
        <label>Audio file
          <input id="file" name="file" type="file" accept="audio/*" required>
        </label>
        <div class="grid">
          <label>Pan speed (Hz)
            <input name="pan_speed_hz" type="number" min="0.01" max="2" step="0.01" value="0.5">
          </label>
          <label>Depth
            <input name="depth" type="number" min="0" max="1" step="0.01" value="0.95">
          </label>
          <label>Room delay (ms)
            <input name="reverb_delay_ms" type="number" min="1" max="500" step="1" value="50">
          </label>
          <label>Room decay
            <input name="reverb_decay" type="number" min="0" max="1" step="0.01" value="0.3">
          </label>
          <label>Room mix
            <input name="reverb_mix" type="number" min="0" max="1" step="0.01" value="0.3">
          </label>
          <label>Target RMS (dBFS)
            <input name="target_rms_db" type="number" min="-60" max="0" step="0.5" value="-18">
          </label>
          <label>Output format
            <select name="output_format"><option value="mp3">MP3</option><option value="wav">WAV</option></select>
          </label>
          <label>Analytic HRTF stage
            <select name="hrtf_enabled"><option value="false" selected>Disabled (Phase 2 baseline)</option><option value="true">Enabled</option></select>
          </label>
        </div>
        <button type="submit">Convert audio</button>
      </form>
      <div id="status" class="status" hidden></div>
    </section>

    <section id="result" class="card" hidden>
      <h2>Processing result</h2>
      <pre id="metrics"></pre>
      <a id="download" class="button" href="#">Download output</a>
    </section>
  </main>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
